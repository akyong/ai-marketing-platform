name: 🚀 Auto Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            cd /var/www/ai-marketing-platform || exit 1
            git config --global --add safe.directory /var/www/ai-marketing-platform
            chmod -R 777 /var/www/ai-marketing-platform/public/build 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            docker compose exec -T app composer install --ignore-platform-reqs --no-interaction --prefer-dist
            docker compose exec -T app npm install
            docker compose exec -T app npm run build
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan workspace:fix-all
            docker compose exec -T app php artisan optimize:clear
            (crontab -l 2>/dev/null | grep -v "ai-marketing-platform"; echo "* * * * * cd /var/www/ai-marketing-platform && docker compose exec -T app php artisan schedule:run >> /dev/null 2>&1") | crontab -
