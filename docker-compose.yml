services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: amp_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis
    restart: always

  nginx:
    image: nginx:latest
    container_name: amp_nginx
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always

  postgres:
    image: postgres:17
    container_name: amp_postgres
    environment:
      POSTGRES_DB: ai_marketing_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: amp_redis
    ports:
      - "6379:6379"
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: amp_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=5m
    cpus: 1.2
    mem_limit: 2200m
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 2200m
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  postgres_data:
  ollama_data:
